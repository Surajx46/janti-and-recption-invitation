  <circle cx="50" cy="24" r="2.5" fill="#FFF9C4"/>
  <circle cx="70" cy="27" r="2.5" fill="#FFF9C4"/>
  <circle cx="22" cy="39" r="2.5" fill="#FFF9C4"/>
  <circle cx="40" cy="36" r="2.5" fill="#FFF9C4"/>
  <circle cx="60" cy="36" r="2.5" fill="#FFF9C4"/>
  <circle cx="78" cy="39" r="2.5" fill="#FFF9C4"/>

