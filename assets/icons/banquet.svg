<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldChandelier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A244" />
      <stop offset="50%" stop-color="#B07D23" />
      <stop offset="100%" stop-color="#8A5E14" />
    </linearGradient>
  </defs>
  <!-- Grand Chandelier / Palace Hall arch -->
  <!-- Top mount chain -->
  <line x1="50" y1="5" x2="50" y2="18" stroke="url(#goldChandelier)" stroke-width="2"/>
  <circle cx="50" cy="18" r="3" fill="url(#goldChandelier)"/>
  
  <!-- Chandelier Tiers -->
  <path d="M30 30 Q50 25 70 30" stroke="url(#goldChandelier)" stroke-width="2" fill="none"/>
  <path d="M22 42 Q50 35 78 42" stroke="url(#goldChandelier)" stroke-width="2.5" fill="none"/>
  <path d="M35 56 Q50 50 65 56" stroke="url(#goldChandelier)" stroke-width="2" fill="none"/>

