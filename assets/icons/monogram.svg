<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="monogramRichGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A244" />
      <stop offset="45%" stop-color="#B07D23" />
      <stop offset="100%" stop-color="#8A5E14" />
    </linearGradient>
  </defs>

  <!-- Outer royal laurel ring -->
  <circle cx="80" cy="80" r="74" stroke="url(#monogramRichGold)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.55"/>
  <circle cx="80" cy="80" r="68" stroke="url(#monogramRichGold)" stroke-width="1.2"/>

  <!-- Royal Crown on top -->
  <path d="M68 34 L73 40 L80 31 L87 40 L92 34 L90 44 L70 44 Z" fill="url(#monogramRichGold)"/>
  <circle cx="68" cy="33" r="1.5" fill="#B82532"/>
  <circle cx="80" cy="29" r="2" fill="#B82532"/>
  <circle cx="92" cy="33" r="1.5" fill="#B82532"/>

  <!-- Laurel leaves Left -->
  <path d="M26 80 C26 52 46 32 60 26 C54 36 50 50 52 64 C44 56 36 65 32 75 C30 84 34 94 40 102 C32 94 28 86 26 80 Z" fill="url(#monogramRichGold)" opacity="0.8"/>
  <!-- Laurel leaves Right -->
  <path d="M134 80 C134 52 114 32 100 26 C106 36 110 50 108 64 C116 56 124 65 128 75 C130 84 126 94 120 102 C128 94 132 86 134 80 Z" fill="url(#monogramRichGold)" opacity="0.8"/>

  <!-- Botanical flourishes bottom -->
  <path d="M80 134 C72 130 64 134 58 138 C64 132 70 126 80 126 C90 126 96 132 102 138 C96 134 88 130 80 134 Z" fill="url(#monogramRichGold)"/>
  <circle cx="80" cy="123" r="2.2" fill="#B82532"/>

  <!-- S & M Monogram Letters -->
  <text x="58" y="94" font-family="'Cinzel', 'Playfair Display', serif" font-size="44" font-weight="700" fill="url(#monogramRichGold)" text-anchor="middle">S</text>
  <text x="80" y="88" font-family="'Great Vibes', cursive" font-size="30" fill="#B82532" text-anchor="middle">&amp;</text>
  <text x="103" y="94" font-family="'Cinzel', 'Playfair Display', serif" font-size="44" font-weight="700" fill="url(#monogramRichGold)" text-anchor="middle">M</text>

  <text x="80" y="114" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="600" fill="#8A5E14" text-anchor="middle" letter-spacing="3.5">SULAV • MANNU</text>
</svg>
