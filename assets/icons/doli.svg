<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <defs>
    <linearGradient id="goldDoli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <!-- Main Carrying Pole -->
  <path d="M5 40 Q60 32 115 40" stroke="url(#goldDoli)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="5" cy="40" r="3" fill="url(#goldDoli)"/>
  <circle cx="115" cy="40" r="3" fill="url(#goldDoli)"/>
  <!-- Doli Dome Roof -->
  <path d="M42 35 C42 20 78 20 78 35 Z" fill="#B71C1C" stroke="url(#goldDoli)" stroke-width="1.5"/>
  <circle cx="60" cy="18" r="3" fill="url(#goldDoli)"/>
  <!-- Dome tassel / kalash top -->
  <line x1="60" y1="18" x2="60" y2="14" stroke="url(#goldDoli)" stroke-width="2"/>
  <!-- Doli Body Box -->
  <rect x="40" y="35" width="40" height="28" rx="3" fill="#880E4F" stroke="url(#goldDoli)" stroke-width="1.8"/>
  <!-- Curtains / Window -->
  <path d="M48 38 C54 48 54 58 48 60 L72 60 C66 58 66 48 72 38 Z" fill="#FFE082" opacity="0.3"/>
  <rect x="52" y="42" width="16" height="15" rx="2" stroke="url(#goldDoli)" stroke-width="1.2" fill="none"/>
  <!-- Golden tassels at base -->
  <line x1="42" y1="63" x2="42" y2="69" stroke="url(#goldDoli)" stroke-width="1.5"/>
  <line x1="50" y1="63" x2="50" y2="69" stroke="url(#goldDoli)" stroke-width="1.5"/>
  <line x1="60" y1="63" x2="60" y2="70" stroke="url(#goldDoli)" stroke-width="2"/>
  <line x1="70" y1="63" x2="70" y2="69" stroke="url(#goldDoli)" stroke-width="1.5"/>
  <line x1="78" y1="63" x2="78" y2="69" stroke="url(#goldDoli)" stroke-width="1.5"/>
  <!-- Base frame -->
  <line x1="36" y1="63" x2="84" y2="63" stroke="url(#goldDoli)" stroke-width="2"/>
</svg>

