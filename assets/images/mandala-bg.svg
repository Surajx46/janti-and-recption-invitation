<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="goldMandala" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFB300" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <g stroke="url(#goldMandala)" stroke-width="1.2">
    <!-- Center Rings -->
    <circle cx="250" cy="250" r="20"/>
    <circle cx="250" cy="250" r="40" stroke-dasharray="3,3"/>
    <circle cx="250" cy="250" r="70"/>
    <circle cx="250" cy="250" r="105"/>
    <circle cx="250" cy="250" r="140" stroke-dasharray="4,4"/>
    <circle cx="250" cy="250" r="180"/>
    <circle cx="250" cy="250" r="220"/>
    <circle cx="250" cy="250" r="240" stroke-dasharray="2,4"/>

    <!-- 12 Petals Layer 1 -->
    <g transform="translate(250,250)">
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" fill="none"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(30)"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(60)"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(90)"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(120)"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(150)"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(180)"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(210)"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(240)"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(270)"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(300)"/>
      <path d="M0,0 Q15,-35 0,-70 Q-15,-35 0,0" transform="rotate(330)"/>
    </g>

    <!-- Outer Petals Layer 2 -->
    <g transform="translate(250,250)">
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" fill="none"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(30)"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(60)"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(90)"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(120)"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(150)"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(180)"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(210)"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(240)"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(270)"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(300)"/>
      <path d="M0,-105 C30,-130 30,-160 0,-180 C-30,-160 -30,-130 0,-105 Z" transform="rotate(330)"/>
    </g>
  </g>
</svg>

