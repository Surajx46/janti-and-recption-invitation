<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="brightGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A84E"/>
      <stop offset="50%" stop-color="#B8862E"/>
      <stop offset="100%" stop-color="#E5C178"/>
    </linearGradient>
    <radialGradient id="blushHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCE4DC" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#FFF4E6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sindoorRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#9E1B28"/>
    </linearGradient>
  </defs>

  <!-- Soft sunlit blush halo -->
  <circle cx="200" cy="145" r="125" fill="url(#blushHalo)"/>

  <!-- Elegant Arch Frame -->
  <path d="M85 245 C85 125 135 45 200 45 C265 45 315 125 315 245" stroke="url(#brightGold)" stroke-width="1.8" fill="none"/>
  <path d="M95 245 C95 135 140 58 200 58 C260 58 305 135 305 245" stroke="url(#brightGold)" stroke-width="0.9" stroke-dasharray="4 4" fill="none"/>

  <!-- Delicate Floral Crest at Top of Arch -->
  <circle cx="200" cy="45" r="5" fill="url(#sindoorRed)"/>
  <circle cx="190" cy="48" r="3" fill="#E6A940"/>
  <circle cx="210" cy="48" r="3" fill="#E6A940"/>

  <!-- Groom Silhouette (Sulav) in Traditional Nepali Daura Suruwal & Topi -->
  <g transform="translate(105, 62)">
    <!-- Dhaka Topi -->
    <path d="M52 40 L74 26 L81 40 L52 46 Z" fill="#9E1B28"/>
    <path d="M55 39 L72 28 L79 39 L55 44 Z" fill="#C62828"/>
    <path d="M74 26 Q79 14 84 11 Q79 22 76 28" stroke="url(#brightGold)" stroke-width="2" fill="url(#brightGold)"/>
    <!-- Face & Head -->
    <path d="M56 46 C51 52 51 62 54 68 C56 73 62 76 68 76 C72 76 76 74 78 70 C80 63 78 53 74 48 Z" fill="#B8862E"/>
    <!-- Daura & Coat -->
    <path d="M46 76 C36 84 28 106 26 142 L80 142 L80 84 C73 78 65 75 46 76 Z" fill="#4E2A2F"/>
    <!-- Dubo & Marigold Mala -->
    <path d="M58 78 Q64 106 77 125" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M58 78 Q64 106 77 125" stroke="#F9A825" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" fill="none"/>
  </g>

  <!-- Bride Silhouette (Mannu) in Festive Red Bridal Sari -->
  <g transform="translate(182, 66)">
    <!-- Bridal Veil / Sari -->
    <path d="M40 38 C46 26 65 28 74 40 C82 50 84 72 82 104 C78 118 74 134 70 138 L34 138 C36 124 32 102 30 84 C28 68 32 45 40 38 Z" fill="url(#sindoorRed)"/>
    <path d="M40 38 C48 28 65 30 73 41" stroke="url(#brightGold)" stroke-width="2" fill="none"/>
    <path d="M40 40 C38 56 34 80 32 108 C31 124 34 134 34 138" stroke="url(#brightGold)" stroke-width="1.6" stroke-dasharray="3 2" fill="none"/>
    <!-- Face Profile -->
    <path d="M44 48 C48 50 53 54 53 61 C53 68 48 72 43 76 Z" fill="#B8862E"/>
    <!-- Maang Tikka -->
    <circle cx="50" cy="46" r="2.2" fill="#F9A825"/>
    <!-- Bridal Garland -->
    <path d="M36 80 Q42 102 48 125" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M36 80 Q42 102 48 125" stroke="#E53935" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" fill="none"/>
  </g>

  <!-- Subtle Heart Accent Between Couple -->
  <path d="M193 185 Q200 177 207 185 Q200 197 193 185 Z" fill="url(#sindoorRed)"/>

  <!-- Floral Garland Bottom Border -->
  <path d="M75 235 Q135 222 200 235 Q265 222 325 235" stroke="url(#brightGold)" stroke-width="2" fill="none"/>
  <circle cx="115" cy="230" r="3.5" fill="#D32F2F"/>
  <circle cx="158" cy="228" r="3.5" fill="#F9A825"/>
  <circle cx="200" cy="234" r="4.5" fill="#D32F2F"/>
  <circle cx="242" cy="228" r="3.5" fill="#F9A825"/>
  <circle cx="285" cy="230" r="3.5" fill="#D32F2F"/>
</svg>
